###############################################################################
### GENERAL ###################################################################
###############################################################################

set -g default-terminal "tmux-256color"
set -g terminal-overrides ",*:Tc"

set -g history-limit 32768
set -g status-interval 1
set -g display-time 0

set -g mouse on
set -g mode-keys vi
set -g detach-on-destroy on
set -g base-index 0
set -g pane-base-index 0

# Activity monitoring
set -g monitor-activity off
set -g monitor-bell off
set -g monitor-silence 0
set -g visual-activity off
set -g visual-bell on
set -g bell-action current # any | none | current | other


###############################################################################
### Aliases ###################################################################
###############################################################################

run-shell 'tmux set -g @cfg "${XDG_CONFIG_HOME:-$HOME/.config}/tmux"'

# Setting this alias from a shell as "source-file -F" also expands the formats in the target file.
# Not sure if a bug, feature or me not getting it
run-shell '
    cfg=$(tmux show -gv @cfg)
    tmux set -as command-alias[100] "reload_cfg=source-file $cfg/tmux.conf"'

# set -as command-alias[100] "reload_cfg=source-file -F '#{@cfg}/tmux.conf'"
set -as command-alias[101] "reload_ui=source-file -F '#{@cfg}/ui.conf'"

set -as command-alias[110] "win_monitor_activity=setw monitor-activity on; setw monitor-silence 0; setw @win_monitor_status +"
set -as command-alias[111] "win_monitor_silence=setw monitor-activity off; setw monitor-silence 30; setw @win_monitor_status -"
set -as command-alias[112] "win_monitor_off=setw monitor-activity off; setw monitor-silence 0; setw -u @win_monitor_status"

set -as command-alias[113] 'cycle_monitoring= \
    if-shell -F "#{==:#{@win_monitor_status},+}" \
        win_monitor_silence \
        "if-shell -F \"#{==:#{@win_monitor_status},-}\" \
            win_monitor_off \
            win_monitor_activity"'


set -as command-alias[120] 'show_theme_menu=display-menu -T " Switch Theme " -x C -y C \
    "Debug"           d  "source-file #{@cfg}/themes/debug.conf; reload_ui" \
    ""                "" "" \
    "Solarized Light" 1  "source-file #{@cfg}/themes/solarized_light.conf; reload_ui" \
    "Solarized Dark"  2  "source-file #{@cfg}/themes/solarized_dark.conf; reload_ui" \
    ""                "" "" \
    "Close Menu"      q  ""'


set -as command-alias[121] 'show_help_menu=display-menu -T " Help! " -x C -y C \
    ""                          ""  "" \
    "Previous window    (^h)"   F1  "previous-window" \
    "Next window        (^l)"   F2  "next-window" \
    "Create window      (^n)"   F3  "new-window" \
    "List windows       (^w)"   F4  "choose-tree" \
    ""                          ""  "" \
    "Reload config      (^r)"   F5  "reload_cfg" \
    "Cycle monitoring   (^m)"   F6  "cycle_monitoring" \
    ""                          ""  "" \
    "Switch theme       (^t)"   F9  "show_theme_menu" \
    "Show help          (^ )"   F10 "show_help_menu" \
    "Detach client      (^q)"   F12 "detach-client" \
    ""                          ""  "" \
    "Close menu"                q   ""'



###############################################################################
### Keybinds ##################################################################
###############################################################################

# Move default bind from Ctrl+B to Ctrl+A
# Lets hope I don't use screen or picocom from tmux
unbind C-b
set -g prefix C-a
bind C-a send-prefix


# Switch window
bind -n F1 previous-window
bind h previous-window

bind -n F2 next-window
bind l next-window


# Create new window
bind -n F3 new-window
bind n new-window


# Show window list
bind -n F4 choose-tree
bind w choose-tree


# Reload config
bind -n F5 reload_cfg
bind r reload_cfg


# Cycle between monitoring modes: Activity -> Silence -> Off
bind -n F6 cycle_monitoring
bind m cycle_monitoring


# Switch theme
bind -n F9 show_theme_menu
bind t show_theme_menu


# Help menu
bind -n F10 show_help_menu
bind space show_help_menu


# Detach from session
bind -n F12 detach-client
bind q detach-client


# I don't have OSC52 support in my terminal so I'll copy clipboard with xsel/wl-clipboard
set -g set-clipboard off
# copy-command doesn't work, not sure why
# set -s copy-command "#{@cfg}/scripts/copy_primary.sh"

# Copy selection to primary buffer after mouse drag release (and keep it selected)
bind -T copy-mode MouseDragEnd1Pane send-keys -X copy-pipe-no-clear "#{@cfg}/scripts/copy_primary.sh" \; display-message "Copy to Primary" \; send-keys -X stop-selection
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-no-clear "#{@cfg}/scripts/copy_primary.sh" \; display-message "Copy-vi to Primary" \; send-keys -X stop-selection

# Ctrl+C will copy the selection to the clipboard and cancel it on second activation (Ctrl+Shift+C is not getting to tmux)
bind -T copy-mode C-c if -F "#{selection_active}" \
    "send-keys -X copy-pipe-no-clear '#{@cfg}/scripts/copy_clipboard.sh' \; display-message 'Copy to Clipboard' \; send-keys -X stop-selection" \
    "send-keys -X cancel"
bind -T copy-mode-vi C-c if -F "#{selection_active}" \
    "send-keys -X copy-pipe-no-clear '#{@cfg}/scripts/copy_clipboard.sh' \; display-message 'Copy-vi to Clipboard' \; send-keys -X stop-selection" \
    "send-keys -X cancel"
# bind -T copy-mode C-c send-keys -X copy-pipe-no-clear "#{@cfg}/scripts/copy_clipboard.sh" \; display-message "Copy to Clipboard" \; send-keys -X stop-selection
# bind -T copy-mode-vi C-c send-keys -X copy-pipe-no-clear "#{@cfg}/scripts/copy_clipboard.sh" \; display-message "Copy-vi to Clipboard" \; send-keys -X stop-selection

# Clear selection after mouse down event
bind -T copy-mode MouseDown1Pane select-pane \; send-keys -X clear-selection
bind -T copy-mode-vi MouseDown1Pane select-pane \; send-keys -X clear-selection

# Return to prompt after mouse up event if we're not making a new selection
bind -T copy-mode MouseUp1Pane run-shell 'tmux display-message -p "#{selection_present}" | grep -q 1 || tmux send-keys -X cancel'
bind -T copy-mode-vi MouseUp1Pane run-shell 'tmux display-message -p "#{selection_present}" | grep -q 1 || tmux send-keys -X cancel'

# Scrolling back to the prompt will give it the focus (Pressing Escape works too)
bind -n MouseDrag1Pane if-shell -Ft = '#{mouse_any_flag}' 'if-shell -Ft = "#{pane_in_mode}" "copy-mode -eM" "send-keys -M"' 'copy-mode -eM'

# Middle click paste from primary buffer
unbind -n MouseDown2Pane
bind -n MouseDown2Pane run-shell '
    tmux display-message "Paste from Primary"
    tmux set-buffer -- "$(#{@cfg}/scripts/paste_primary.sh)"
    tmux paste-buffer'


###############################################################################
### INIT ######################################################################
###############################################################################

# source-file ~/.config/tmux/themes/debug.conf
source-file ~/.config/tmux/themes/solarized_light.conf
source-file ~/.config/tmux/ui.conf

